<form class="form" [formGroup]="form" (ngSubmit)="submit()">
  <p class="hint">
    This changes the password for the signed-in account. Other accounts stay signed in.
    After it is saved, sign in again with the new password.
  </p>
  @if (error()) {
    <p class="notice error" role="alert">{{ error() }}</p>
  }
  <label>
    Current password
    <input type="password" formControlName="currentPassword" autocomplete="current-password" maxlength="128" />
  </label>
  <label>
    New password
    <input type="password" formControlName="newPassword" autocomplete="new-password" maxlength="128" />
  </label>
  <p class="hint">The new password must be at least 8 characters. It is stored only as a hash.</p>
  <button type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Saving…' : 'Change password' }}
  </button>
</form>
